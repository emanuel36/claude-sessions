[project]
name = "claude-sessions"
version = "1.0.0"
description = "Tabs that show which Claude Code session needs you"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["textual>=8.2,<9"]

[project.scripts]
cs = "claude_sessions.cli:main"
cst = "claude_sessions.term.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_sessions"]
include = [
    "src/claude_sessions/**/*.py",
    "src/claude_sessions/term/data/*",
    "src/claude_sessions/panel/view/*.tcss",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
