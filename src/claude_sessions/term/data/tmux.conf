# tmux for Claude Code sessions. Runs on its own server (`tmux -L claude`), started by `cst`.
# Each window is a session, coloured in the status line by the @claude_status pane option the
# hook sets. Needs tmux 3.3 or newer: allow-passthrough, popup-style, popup-border-lines and
# display-popup -T arrive in 3.3.

# --- Terminal -------------------------------------------------------------------------------
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g mouse on
set -sg escape-time 10
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string '#{session_name}: #{window_name}'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keys: Alt + one key, no prefix ---------------------------------------------------------
# Ctrl+b goes back to Claude Code (it backgrounds a command); the prefix is only for rare
# tmux commands
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 last-window
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-n run-shell 'cs next'
# Alt+r renames the tab. An empty name gives back the automatic one (the project folder),
# which follows the session again.
bind -n M-r command-prompt -p " Tab name:" {
  if -F "#{==:%1,}" {
    if -F "#{@cs-auto-name}" { rename-window -- "#{@cs-auto-name}" } { set -w automatic-rename on }
  } { rename-window -- "%1" }
}

# Popups (Alt+c, Alt+g) take the terminal's own background, with a quiet rounded border
set -g popup-style default
set -g popup-border-style fg=colour240
set -g popup-border-lines rounded

# --- Mouse ---------------------------------------------------------------------------------
# Clicking a tab, selecting, scrolling, pasting and resizing stay. What a stray click or
# scroll could set off is off: switching tabs with the wheel, swapping tabs, the right-click
# menus (they can kill a tab or pane), moving or creating panes by dragging, and the buttons on
# pane borders.
unbind -n DoubleClick1Status
unbind -n WheelUpStatus
unbind -n WheelDownStatus
unbind -n C-MouseDown1Status
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Empty
unbind -n M-MouseDown3Empty
unbind -n M-MouseDrag1Pane
unbind -n M-MouseDrag1Border
unbind -n C-MouseDrag1Pane
unbind -n C-MouseDrag1Empty
# -q: these keys exist only since tmux 3.7, and an older tmux would report them as unknown
unbind -q -n MouseDown1Control7
unbind -q -n MouseDown1Control8
unbind -q -n MouseDown1Control9

# --- Status of each window ------------------------------------------------------------------
# The most urgent status among the window's panes (the leader and any teammates)
set -g @cs-has-permission "#{P:#{?#{==:#{@claude_status},permission},1,}}"
set -g @cs-has-input "#{P:#{?#{==:#{@claude_status},input},1,}}"
set -g @cs-has-done "#{P:#{?#{==:#{@claude_status},done},1,}}"
set -g @cs-has-working "#{P:#{?#{==:#{@claude_status},working},1,}}"
set -g @cs-st "#{?#{E:@cs-has-permission},permission,\
#{?#{E:@cs-has-input},input,\
#{?#{E:@cs-has-done},done,\
#{?#{E:@cs-has-working},working,idle}}}}"

# Each tab is written in its status's colour
set -g @cs-fg "#{?#{==:#{E:@cs-st},permission},fg=red bold,\
#{?#{==:#{E:@cs-st},input},fg=yellow bold,\
#{?#{==:#{E:@cs-st},done},fg=green,\
#{?#{==:#{E:@cs-st},working},fg=blue bold,fg=colour244}}}}"
# The current tab is a block in its status's colour, light grey when idle
set -g @cs-current "#{?#{==:#{E:@cs-st},permission},bg=red,\
#{?#{==:#{E:@cs-st},input},bg=yellow,\
#{?#{==:#{E:@cs-st},done},bg=green,\
#{?#{==:#{E:@cs-st},working},bg=blue,bg=colour250}}}} fg=black bold"
# Working tabs blink a circle once a second: %S is the clock's seconds, so no process drives it
set -g @cs-icon "#{?#{==:#{E:@cs-st},permission},! ,\
#{?#{==:#{E:@cs-st},input},? ,\
#{?#{==:#{E:@cs-st},done},✓ ,\
#{?#{==:#{E:@cs-st},working},#{?#{m:*[02468],%S},●,○} ,}}}}"
set -g @cs-panes "#{?#{>:#{window_panes},1}, +#{e|-:#{window_panes},1},}"
# How long a session has been waiting for you, from the @cs-since its hook sets (%s is now)
set -g @cs-waited "#{e|-:%s,#{@cs-since}}"
set -g @cs-waiting "#{P:#{?@cs-since,#{?#{e|>=:#{E:@cs-waited},3600},\
 #{e|/:#{E:@cs-waited},3600}h,#{?#{e|>=:#{E:@cs-waited},60}, #{e|/:#{E:@cs-waited},60}m,}},}}"
# Names longer than 16 columns are cut, so many tabs still fit
set -g @cs-name "#{?#{e|>:#{w:window_name},16},#{=15:window_name}…,#{window_name}}"
set -g @cs-label " #{E:@cs-icon}#{E:@cs-name}#{E:@cs-panes}#{E:@cs-waiting} "
# Tab 1, the session list, is ≡, set apart by a bar
set -g @cs-sessions " ≡ "
set -g @cs-list-end "#[default]#[fg=colour238]│"

set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=default fg=colour244'
set -g status-left ''
set -g status-right-length 60
# A dot for each tab that needs you, in its colour
set -g status-right "#{W:#{?#{==:#{E:@cs-st},permission},#[fg=red bold]● ,\
#{?#{==:#{E:@cs-st},input},#[fg=yellow bold]● ,}}}#[default]%H:%M "
# Tabs are padded by a space on each side, so they need no separator. tmux's own styles for
# the current tab (underlined) and for activity (reversed) are turned off: colour says it all.
set -g window-status-separator ''
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
set -g window-status-format "#{?#{==:#{window_index},1},\
#[fg=colour244]#{E:@cs-sessions}#{E:@cs-list-end},#[#{E:@cs-fg}]#{E:@cs-label}}#[default]"
set -g window-status-current-format "#{?#{==:#{window_index},1},\
#[bg=colour250 fg=black bold]#{E:@cs-sessions}#{E:@cs-list-end},\
#[#{E:@cs-current}]#{E:@cs-label}}#[default]"

# Looking at a finished session settles it: switching to it, or attaching straight onto it
set -g @cs-seen 'cs seen --tmux-pane #{pane_id} --tmux-socket #{socket_path}'
set-hook -g session-window-changed 'run-shell -b "#{E:@cs-seen}"'
set-hook -g window-pane-changed 'run-shell -b "#{E:@cs-seen}"'
set-hook -g client-attached 'run-shell -b "#{E:@cs-seen}"'
set-hook -g client-session-changed 'run-shell -b "#{E:@cs-seen}"'
