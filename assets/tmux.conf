# tmux for Claude Code sessions. Runs on its own server (`tmux -L claude`), started by `cst`.
# Each window is a session; the sidebar on its left lists them all. Needs tmux 3.3 or newer:
# allow-passthrough, popup-style, popup-border-lines and display-popup -T arrive in 3.3.

# --- Terminal -------------------------------------------------------------------------------
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g mouse on
set -sg escape-time 10
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string '#{session_name}: #{window_name}'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keys: Alt + one key, no prefix ---------------------------------------------------------
# Ctrl+b goes back to Claude Code (it backgrounds a command); the prefix is only for rare
# tmux commands
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Alt+Up/Down move between sessions in the order the sidebar lists them, which groups them by
# urgency; the landing page is stepped over
bind -n M-Up run-shell -b "cst step up #{window_id}"
bind -n M-Down run-shell -b "cst step down #{window_id}"
# Alt+r renames the session. An empty name gives back the automatic one (the session's title),
# which follows the session again.
bind -n M-r command-prompt -p " Session name:" {
  if -F "#{==:%1,}" {
    if -F "#{@cs-auto-name}" { rename-window -- "#{@cs-auto-name}" } { set -w automatic-rename on }
  } { rename-window -- "%1" }
}

# Alt+n picks a folder for a new session. run-shell has no client to show a popup on, so the
# popup is bound directly.
bind -n M-n display-popup -E -w 52 -h 22 -T ' New session ' 'cst new --pick'
# Alt+c closes the session after a confirmation; `cst close` stops its background session first
bind -n M-c confirm-before -p "close #{window_name}? (y/n)" "run-shell 'cst close #{window_id}'"

# The Alt+n popup takes the terminal's own background, with a quiet rounded border
set -g popup-style default
set -g popup-border-style fg=colour240
set -g popup-border-lines rounded

# --- Mouse ---------------------------------------------------------------------------------
# Clicking a pane, selecting, scrolling, pasting and resizing stay. What a stray click or
# scroll could set off is off: switching windows with the wheel, swapping windows, the right-click
# menus (they can kill a window or pane), moving or creating panes by dragging, and the buttons on
# pane borders.
unbind -n DoubleClick1Status
unbind -n WheelUpStatus
unbind -n WheelDownStatus
unbind -n C-MouseDown1Status
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Empty
unbind -n M-MouseDown3Empty
unbind -n M-MouseDrag1Pane
unbind -n M-MouseDrag1Border
unbind -n C-MouseDrag1Pane
unbind -n C-MouseDrag1Empty
# -q: these keys exist only since tmux 3.7, and an older tmux would report them as unknown
unbind -q -n MouseDown1Control7
unbind -q -n MouseDown1Control8
unbind -q -n MouseDown1Control9

# --- Sidebar --------------------------------------------------------------------------------
# Every new window gets the sidebar on its left; a split or a terminal resize puts it back at
# its width. tmux resizes a window only when it becomes the current one, so the fit follows each
# window's own resize; client-resized would fire before the windows have their new size.
# `cst layout` also closes a window once its sidebar is all that is left in it (Claude exited
# or its pane was killed), and sends F10 to the sidebar or landing page on screen, which then
# lists the windows again.
# The after-* hooks run in the background (-b): without it, the tmux command that set the hook
# off waits for `cst layout`, and `cst layout` runs tmux commands that set off these hooks
# again (its own split for the sidebar). The other hooks hold up no command, so they run in
# the foreground, one at a time and in order with `cst focus` below: a late F10 from them
# cannot wake a sidebar that `cst focus` has just hidden. `cst layout` gives the same result
# whatever the order its runs end in.
set-hook -g after-new-window 'run-shell -b "cst layout #{window_id}"'
set-hook -g after-split-window 'run-shell -b "cst layout"'
set-hook -g after-kill-pane 'run-shell -b "cst layout"'
set-hook -g window-resized 'run-shell "cst layout"'
set-hook -g pane-exited 'run-shell "cst layout"'
set-hook -g window-renamed 'run-shell "cst layout"'
set-hook -g window-unlinked 'run-shell "cst layout"'
# A click in the sidebar reaches it without selecting the pane: it never takes the keyboard
bind -n MouseDown1Pane if -F "#{@cs-sidebar}" {
  send-keys -M
} {
  select-pane -t =
  send-keys -M
}
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour238

# No status bar: the sidebar shows every session
set -g status off

# Looking at a window: `cst focus` sends F12 to its sidebar or landing page, which redraws at
# once, and F11 to the one of the window shown before (kept in @cs-last-window), which stops
# drawing. A window with neither gets nothing, so Claude never sees these keys. It also settles
# the finished session in the pane: switching to it, or attaching straight onto it.
# Not in the background (-b): tmux then runs them one at a time, in the order the switches
# came, so two quick switches cannot deliver their keys out of order. run-shell shows a failed
# command's output over the pane, so `cst focus` prints nothing and always succeeds.
set -g @cs-focus 'cst focus --pane #{pane_id} --socket #{q:socket_path}'
set-hook -g session-window-changed 'run-shell "#{E:@cs-focus}"'
set-hook -g window-pane-changed 'run-shell "#{E:@cs-focus}"'
set-hook -g client-attached 'run-shell "#{E:@cs-focus}"'
set-hook -g client-session-changed 'run-shell "#{E:@cs-focus}"'
