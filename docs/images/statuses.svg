<svg xmlns="http://www.w3.org/2000/svg" width="600" height="148" viewBox="0 0 600 148">
<rect width="100%" height="100%" rx="10" fill="#16181d"/>
<g font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="14" xml:space="preserve">
<text x="20" y="30" fill="#ff6b80">!</text><text x="40" y="30" fill="#ffffff" font-weight="bold">Permission</text><text x="160" y="30" fill="#ff6b80">2m</text><text x="210" y="30" fill="#999999">needs your approval to run something</text>
<text x="20" y="50" fill="#ffc107">?</text><text x="40" y="50" fill="#ffffff" font-weight="bold">Question</text><text x="160" y="50" fill="#ffc107">5m</text><text x="210" y="50" fill="#999999">asked something, or has a plan to approve</text>
<text x="20" y="70" fill="#4eba65">✓</text><text x="40" y="70" fill="#ffffff" font-weight="bold">Finished</text><text x="160" y="70" fill="#4eba65">1m</text><text x="210" y="70" fill="#999999">turn ended, not seen yet</text>
<text x="20" y="90" fill="#d77757">✻</text><text x="40" y="90" fill="#ffffff" font-weight="bold">Working</text><text x="210" y="90" fill="#999999">running tools or background agents</text>
<text x="20" y="110" fill="#b1b9f9">◐</text><text x="40" y="110" fill="#ffffff" font-weight="bold">Shell</text><text x="210" y="110" fill="#999999">turn ended; a shell command still runs</text>
<text x="20" y="130" fill="#999999">○</text><text x="40" y="130" fill="#d0cfcc">Idle</text><text x="210" y="130" fill="#999999">seen, or interrupted with Esc</text>
</g></svg>
